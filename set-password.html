<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>設定密碼｜田徑錦標賽</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap" style="max-width:520px">
    <section class="card">
      <h1>設定密碼</h1>
      <div id="msg"><p class="muted">驗證中…</p></div>
      <form id="pw-form" style="display:flex;flex-direction:column;gap:12px" hidden>
        <label>新密碼（至少 8 個字元）<input type="password" name="pw" required minlength="8" autocomplete="new-password"></label>
        <label>再輸入一次<input type="password" name="pw2" required minlength="8" autocomplete="new-password"></label>
        <button class="btn btn-primary" type="submit">儲存密碼</button>
      </form>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/common.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/set-password.js"></script>
</body>
</html>
